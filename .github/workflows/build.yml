name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v2

    - name: Create Project Structure and Files
      run: |
        mkdir -p app/src/main/java/com/example/pcunlocker app/src/main/res/layout app/src/main/assets
        
        [ -f MainActivity.kt ] && mv MainActivity.kt app/src/main/java/com/example/pcunlocker/ || true
        [ -f UnlockClient.kt ] && mv UnlockClient.kt app/src/main/java/com/example/pcunlocker/ || true
        [ -f UnlockViewModel.kt ] && mv UnlockViewModel.kt app/src/main/java/com/example/pcunlocker/ || true
        [ -f DashboardScreen.kt ] && mv DashboardScreen.kt app/src/main/java/com/example/pcunlocker/ || true
        [ -f CryptoUtils.kt ] && mv CryptoUtils.kt app/src/main/java/com/example/pcunlocker/ || true
        [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/ || true

        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "PCUnlocker"
        include ':app'
        EOF

        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.1.1' apply false
            id 'org.jetbrains.kotlin.android' version '1.8.10' apply false
        }
        EOF

        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }

        android {
            namespace 'com.example.pcunlocker'
            compileSdk 33

            defaultConfig {
                applicationId "com.example.pcunlocker"
                minSdk 24
                targetSdk 33
                versionCode 1
                versionName "1.0"
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }

            kotlinOptions {
                jvmTarget = '17'
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.10.1'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.9.0'
        }
        EOF

    - name: Generate Gradle Wrapper & Build APK
      run: |
        gradle wrapper --gradle-version 8.0
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload Debug APK
      uses: actions/upload-artifact@v3
      with:
        name: pc-unlock-app
        path: app/build/outputs/apk/debug/app-debug.apk
